name: "Prompt Provenance Diff"
description: "PR gate for prompt-provenance document changes. Retrieves the previous version of the doc via `git show <base.sha>:<doc-path>`, diffs against HEAD using prompt-provenance-diff, posts the structured diff as a PR comment, and fails the build on breaking changes (hash, approval, parent, out-of-scope)."
author: "mizcausevic-dev"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  doc-path:
    description: "Path (relative to repo root) to the prompt-provenance JSON document being changed in the PR."
    required: true
  base-sha:
    description: "Override the base SHA used to retrieve the previous version. Defaults to pull_request.base.sha from the event payload."
    required: false
  comment-on-pr:
    description: "Post the Markdown diff as a PR comment. 'auto' (default) posts only on pull_request events; 'true' / 'false' force the behavior."
    required: false
    default: "auto"
  fail-on-breaking:
    description: "Fail the run when the diff is classified as BREAKING (default 'true')."
    required: false
    default: "true"
  fail-on-any-change:
    description: "Fail the run when there is ANY diff at all (default 'false')."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR comment (defaults to GITHUB_TOKEN)."
    required: false
    default: ${{ github.token }}

outputs:
  breaking:
    description: "True iff the diff is BREAKING."
  change-count:
    description: "Number of changes detected in the diff."
  new-doc:
    description: "True iff the doc path didn't exist at base SHA (newly added document)."

runs:
  using: "node20"
  main: "dist/index.js"
